<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="crispEdges">
  <!-- Rounded terminal app tile -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="#1e1e2e" shape-rendering="geometricPrecision"/>
  <rect x="24" y="24" width="464" height="464" rx="88" ry="88" fill="none" stroke="#313244" stroke-width="6" shape-rendering="geometricPrecision"/>

  <!-- Subtle Unicode box-drawing corner brackets (┌─ ─┐ └─ ─┘) in Larry accent -->
  <g fill="#cba6f7" opacity="0.75">
    <!-- Top-left ┌─ -->
    <rect x="64" y="64" width="40" height="8"/>
    <rect x="64" y="64" width="8" height="40"/>
    <!-- Top-right ─┐ -->
    <rect x="408" y="64" width="40" height="8"/>
    <rect x="440" y="64" width="8" height="40"/>
    <!-- Bottom-left └─ -->
    <rect x="64" y="408" width="8" height="40"/>
    <rect x="64" y="440" width="40" height="8"/>
    <!-- Bottom-right ─┘ -->
    <rect x="440" y="408" width="8" height="40"/>
    <rect x="408" y="440" width="40" height="8"/>
  </g>

  <!-- Pixel/Unicode block grid: 16x14 centered at (80, 96), cell = 22px (width=352, height=308) -->
  <!-- Subtle outer outline so black fur pops cleanly on dark backgrounds -->
  <g fill="#45475a" transform="translate(80, 96)">
    <!-- Ears & head outline shadow (+2px border halo) -->
    <rect x="40" y="-4" width="52" height="26"/>
    <rect x="260" y="-4" width="52" height="26"/>
    <rect x="40" y="18" width="74" height="26"/>
    <rect x="238" y="18" width="74" height="26"/>
    <rect x="40" y="40" width="272" height="26"/>
    <rect x="18" y="62" width="316" height="136"/>
    <rect x="40" y="194" width="272" height="48"/>
    <rect x="62" y="238" width="228" height="26"/>
    <rect x="40" y="260" width="272" height="52"/>
  </g>

  <!-- Main Tuxedo Cat ("Gato Frajola") in crisp Unicode block geometry -->
  <g transform="translate(80, 96)">
    <!-- BLACK FUR (#0b0b10) -->
    <g fill="#0b0b10">
      <!-- Row 0: ear tips (cols 2-3, 12-13) -->
      <rect x="44" y="0" width="44" height="22"/>
      <rect x="264" y="0" width="44" height="22"/>

      <!-- Row 1: ears (cols 2..4, 11..13) -->
      <rect x="44" y="22" width="66" height="22"/>
      <rect x="242" y="22" width="66" height="22"/>

      <!-- Row 2: top of head (cols 2..13) -->
      <rect x="44" y="44" width="264" height="22"/>

      <!-- Row 3: forehead (cols 1..14) -->
      <rect x="22" y="66" width="308" height="22"/>

      <!-- Row 4: mask with white blaze at 7..8 -->
      <rect x="22" y="88" width="132" height="22"/>
      <rect x="198" y="88" width="132" height="22"/>

      <!-- Row 5: eye row black fur -->
      <rect x="22" y="110" width="132" height="22"/>
      <rect x="198" y="110" width="132" height="22"/>

      <!-- Row 6: lower eye row black fur (white widens to 6..9) -->
      <rect x="22" y="132" width="110" height="22"/>
      <rect x="220" y="132" width="110" height="22"/>

      <!-- Row 7: cheeks (white widens to 5..10) -->
      <rect x="22" y="154" width="88" height="22"/>
      <rect x="242" y="154" width="88" height="22"/>

      <!-- Row 8: lower cheeks (white muzzle 3..12) -->
      <rect x="22" y="176" width="44" height="22"/>
      <rect x="286" y="176" width="44" height="22"/>

      <!-- Row 9: jaw edges (cols 2, 13) -->
      <rect x="44" y="198" width="22" height="22"/>
      <rect x="286" y="198" width="22" height="22"/>

      <!-- Row 10: chin sides (cols 2-3, 12-13) -->
      <rect x="44" y="220" width="44" height="22"/>
      <rect x="264" y="220" width="44" height="22"/>

      <!-- Row 11: neck sides (cols 3-4, 11-12) -->
      <rect x="66" y="242" width="44" height="22"/>
      <rect x="242" y="242" width="44" height="22"/>

      <!-- Row 12: tuxedo shoulders (cols 2..5, 10..13) -->
      <rect x="44" y="264" width="88" height="22"/>
      <rect x="220" y="264" width="88" height="22"/>

      <!-- Row 13: tuxedo chest base (cols 2..6, 9..13) -->
      <rect x="44" y="286" width="110" height="22"/>
      <rect x="198" y="286" width="110" height="22"/>
    </g>

    <!-- WHITE FRAJOLA MARKINGS (#f5f5f9) -->
    <g fill="#f5f5f9">
      <!-- Row 4-5: forehead blaze (cols 7..8) -->
      <rect x="154" y="88" width="44" height="44"/>
      <!-- Row 6: bridge of nose (cols 6..9) -->
      <rect x="132" y="132" width="88" height="22"/>
      <!-- Row 7: upper muzzle (cols 5..10) -->
      <rect x="110" y="154" width="132" height="22"/>
      <!-- Row 8: full white muzzle (cols 3..12) -->
      <rect x="66" y="176" width="220" height="22"/>
      <!-- Row 9: mouth row (cols 3..12) -->
      <rect x="66" y="198" width="220" height="22"/>
      <!-- Row 10: chin (cols 4..11) -->
      <rect x="88" y="220" width="176" height="22"/>
      <!-- Row 11: tuxedo bib top (cols 5..10) -->
      <rect x="110" y="242" width="132" height="22"/>
      <!-- Row 12: tuxedo bib mid (cols 6..9) -->
      <rect x="132" y="264" width="88" height="22"/>
      <!-- Row 13: tuxedo bib tip (cols 7..8) -->
      <rect x="154" y="286" width="44" height="22"/>
    </g>

    <!-- INNER EARS (soft pink #f38ba8) -->
    <g fill="#f38ba8">
      <rect x="66" y="22" width="22" height="22"/>
      <rect x="264" y="22" width="22" height="22"/>
    </g>

    <!-- EXPRESSIVE CAT EYES (emerald green #86e27f + centered dark pupil + white glint) -->
    <g>
      <!-- Left eye (cols 3..4: x=66..110, rows 5..6: y=110..154) -->
      <rect x="66" y="110" width="44" height="44" fill="#86e27f"/>
      <rect x="80" y="110" width="16" height="44" fill="#0b0b10"/>
      <rect x="70" y="114" width="10" height="10" fill="#ffffff"/>

      <!-- Right eye (cols 11..12: x=242..286, rows 5..6: y=110..154) -->
      <rect x="242" y="110" width="44" height="44" fill="#86e27f"/>
      <rect x="256" y="110" width="16" height="44" fill="#0b0b10"/>
      <rect x="246" y="114" width="10" height="10" fill="#ffffff"/>
    </g>

    <!-- PINK NOSE (centered cols 7..8, row 7, crisp half-block shape) -->
    <rect x="160" y="158" width="32" height="18" fill="#f38ba8"/>
    <rect x="168" y="176" width="16" height="6" fill="#f38ba8"/>

    <!-- CUTE UNICODE CAT MOUTH (:3 / ^ style in crisp blocks) -->
    <g fill="#181825">
      <rect x="172" y="182" width="8" height="16"/>
      <rect x="148" y="198" width="24" height="8"/>
      <rect x="180" y="198" width="24" height="8"/>
      <rect x="140" y="190" width="8" height="8"/>
      <rect x="204" y="190" width="8" height="8"/>
    </g>

    <!-- UNICODE WHISKERS (crisp horizontal block lines) -->
    <g fill="#cdd6f4">
      <!-- Left whiskers -->
      <rect x="-16" y="176" width="48" height="8"/>
      <rect x="-10" y="202" width="42" height="8"/>
      <!-- Right whiskers -->
      <rect x="320" y="176" width="48" height="8"/>
      <rect x="320" y="202" width="42" height="8"/>
    </g>
  </g>
</svg>
